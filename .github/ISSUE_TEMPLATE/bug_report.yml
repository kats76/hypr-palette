name: Bug report
description: Something looks wrong with the Firefox theme or the Vimium styles
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: What looks wrong?
      options:
        - Firefox theme
        - Vimium link hints
        - Vimium search bar (Vomnibar)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Firefox version (about:support) and theme version.
      placeholder: Firefox 159.0, Hypr Palette 1.0.0
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: A screenshot helps a lot.
    validations:
      required: true
